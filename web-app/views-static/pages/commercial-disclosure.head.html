    <style>
        :root {
            --primary-color: #1e40af;
            /* Deep Blue from home.ejs */
            --text-color: #333;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--text-color);
            background-color: var(--bg-light);
            line-height: 1.6;
        }

        .page-header {
            background-color: white;
            padding: 3rem 0;
            margin-bottom: 3rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .notice-box {
            background-color: #fff;
            border: 1px solid #e5e7eb;
            border-left: 4px solid var(--primary-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .notice-box h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.75rem;
        }

        .notice-box p:last-child {
            margin-bottom: 0;
        }

        .revision-note {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 1.5rem;
        }

        .page-title {
            color: var(--primary-color);
            font-weight: 700;
            text-align: center;
            margin-bottom: 0;
        }

        .disclosure-table {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .disclosure-table th {
            width: 30%;
            background-color: #f1f5f9;
            color: var(--primary-color);
            padding: 1.5rem;
            vertical-align: middle;
            font-weight: 700;
        }

        .disclosure-table td {
            padding: 1.5rem;
            vertical-align: middle;
        }

        @media (max-width: 768px) {

            .disclosure-table th,
            .disclosure-table td {
                display: block;
                width: 100%;
            }

            .disclosure-table th {
                border-bottom: none;
                padding-bottom: 0.5rem;
            }

            .disclosure-table td {
                padding-top: 0.5rem;
                border-top: none;
            }
        }
    </style>
